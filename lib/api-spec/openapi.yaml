openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: events
    description: Live events feed
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /events:
    get:
      operationId: getEvents
      tags: [events]
      summary: Get upcoming Seattle events
      description: Returns upcoming concert/music events near Seattle from SeatGeek, Ticketmaster, or a fallback list of event calendar links
      responses:
        "200":
          description: Events list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Event:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        venue:
          type: string
        date:
          type: string
        ticketsUrl:
          type: string
      required:
        - id
        - title
        - venue
        - date
        - ticketsUrl
    EventsResponse:
      type: object
      properties:
        source:
          type: string
          description: "Which source was used: seatgeek, ticketmaster, or fallback"
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        fallbackLinks:
          description: Populated when source is fallback
          type: ["array", "null"]
          items:
            type: object
            properties:
              label:
                type: string
              url:
                type: string
            required:
              - label
              - url
      required:
        - source
        - events
